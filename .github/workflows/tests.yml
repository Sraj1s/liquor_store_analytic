name: Pipeline and dashboard tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_only_password
          MYSQL_DATABASE: liquor_analytics_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_only_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_BACKEND: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: liquor_analytics_test
      DB_USER: root
      DB_PASSWORD: ci_only_password
      RUN_MYSQL_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e . --no-deps
      - run: ruff check src dashboard tests
      - run: ruff format --check src dashboard tests
      - run: python -m pytest -q
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: python scripts/browser_smoke.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-verification
          path: artifacts/
          retention-days: 14
